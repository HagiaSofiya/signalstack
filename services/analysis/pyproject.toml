[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalstack-analysis"
version = "0.1.0"
description = "Python analysis service for SignalStack datasets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
